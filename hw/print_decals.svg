<text x="196" y="368" font-size="4" font-weight="700" letter-spacing="2" fill="#3a3a3a" text-anchor="middle">M I N I T O O</text>
<text x="137" y="470" font-size="4" fill="#555" text-anchor="middle">電源圖示</text>
<text x="183" y="408" font-size="4" fill="#555" text-anchor="middle">MODE</text>
<text x="183" y="461" font-size="4" fill="#555" text-anchor="middle">▶︎ ‖</text>
<text x="137" y="408" font-size="4" fill="#555" text-anchor="middle">＋ / −</text>
<text x="384.0" y="102" font-size="13" font-weight="700" fill="#111">品牌條</text>
<text x="384.0" y="120" font-size="11" fill="#555">寬 ≤ 26mm，字高 2.6mm，置中；距離螢幕窗下緣 3.5mm</text>
<text x="384.0" y="154" font-size="13" font-weight="700" fill="#111">功能字</text>
<text x="384.0" y="172" font-size="11" fill="#555">字高 2.2mm，深灰 #555；四鍵各一組（電源圖示／MODE／播放鍵／±）</text>
<text x="384.0" y="206" font-size="13" font-weight="700" fill="#111">製程</text>
<text x="384.0" y="224" font-size="11" fill="#555">絲印 1 色（深灰）或 UV 印刷；亦可雷雕 0.15 深（不需油墨）</text>
<text x="384.0" y="258" font-size="13" font-weight="700" fill="#111">公差</text>
<text x="384.0" y="276" font-size="11" fill="#555">字樣位置 ±0.2mm；與邊緣距離 ≥ 2.5mm</text>
<text x="384.0" y="310" font-size="13" font-weight="700" fill="#111">注意</text>
<text x="384.0" y="328" font-size="11" fill="#555">本稿依照片推定；實機到位後以卡尺校核鍵距與字高再定稿</text>
