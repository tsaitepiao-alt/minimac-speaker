<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>miniMac Speaker MM96 ─ 3D 機構與爆炸圖</title>
<style>
  :root{--bg:#0d1218;--panel:#141d27;--line:#26374a;--fg:#e8eef6;--dim:#8fa3b8;--ok:#4ade80;--bad:#f87171;--hi:#ffb74d}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);font-family:"PingFang TC","Noto Sans TC",system-ui,sans-serif;overflow:hidden}
  #c{position:fixed;inset:0;display:block}
  .panel{position:fixed;background:rgba(20,29,39,.92);border:1px solid var(--line);border-radius:12px;backdrop-filter:blur(6px)}
  #hud{left:16px;top:16px;padding:14px 16px;width:330px}
  #hud h1{margin:0 0 2px;font-size:19px}
  #hud .sub{color:var(--dim);font-size:12px;margin-bottom:10px}
  .row{display:flex;justify-content:space-between;font-size:13px;padding:3px 0;border-bottom:1px dashed #1d2a38}
  .row b{font-weight:600}
  #ctrl{left:16px;bottom:16px;padding:12px 16px;width:330px}
  #ctrl label{font-size:13px;color:var(--dim);display:block;margin-bottom:6px}
  input[type=range]{width:100%;accent-color:var(--hi)}
  .btns{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
  button{background:#1d2a38;color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:12px;cursor:pointer}
  button:hover{border-color:var(--hi);color:var(--hi)}
  #check{right:16px;top:16px;padding:14px 16px;width:360px;max-height:70vh;overflow:auto}
  #check h2{margin:0 0 8px;font-size:15px;color:var(--hi)}
  #check table{width:100%;border-collapse:collapse;font-size:12px}
  #check td{padding:3px 4px;border-bottom:1px solid #1d2a38;color:var(--dim)}
  #check td:last-child{text-align:right;color:var(--fg)}
  .ok{color:var(--ok)!important}.bad{color:var(--bad)!important}
  @media (max-width:1000px){
    #check{display:none}
    #hud{width:auto;max-width:calc(100vw - 32px)}
    #ctrl{width:auto;max-width:calc(100vw - 32px)}
  }
  #loading{position:fixed;inset:0;display:grid;place-items:center;font-size:14px;color:var(--dim);background:var(--bg);z-index:9}
</style>
</head>
<body>
<div id="loading">載入 3D 模型…</div>
<canvas id="c"></canvas>

<div class="panel" id="hud">
  <h1>miniMac Speaker MM96</h1>
  <div class="sub">迷你麥金塔造型藍牙音響 · 3D 機構爆炸圖</div>
  <div class="row"><span>外觀尺寸</span><b id="d-out">—</b></div>
  <div class="row"><span>內部淨空間</span><b id="d-in">—</b></div>
  <div class="row"><span>螢幕窗</span><b id="d-win">—</b></div>
  <div class="row"><span>單體孔</span><b id="d-drv">—</b></div>
  <div class="row"><span>額頭／下巴</span><b id="d-fc">—</b></div>
  <div class="row"><span>列印件</span><b>2 件主殼＋旋鈕＋壓框</b></div>
</div>

<div class="panel" id="check">
  <h2>① 尺寸核對（自動計算）</h2>
  <table id="tbl"></table>
  <p style="font-size:12px;color:var(--dim);margin:8px 0 0" id="verdict"></p>
</div>

<div class="panel" id="ctrl">
  <label>爆炸檢視（把零件拉開）</label>
  <input type="range" id="explode" min="0" max="100" value="0">
  <div class="btns">
    <button onclick="setView('front')">正視</button>
    <button onclick="setView('iso')">斜 3/4</button>
    <button onclick="setView('back')">後視</button>
    <button onclick="setView('bottom')">底視</button>
    <button id="spin">自動旋轉：關</button>
  </div>
</div>

<script src="https://unpkg.com/three@0.128.0/build/three.min.js"></script>
<script src="https://unpkg.com/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://unpkg.com/three@0.128.0/examples/js/loaders/STLLoader.js"></script>
<script>
const PARTS = [
  {file:'stl/body.stl',     color:0xd9d3c3, name:'後殼（含側板／底板／背板）', explode:[0,  0, 0]},
  {file:'stl/faceplate.stl',color:0xf2ecdf, name:'面板（螢幕窗／軟碟槽／旋鈕孔）', explode:[0,-70, 0]},
  {file:'stl/knob.stl',     color:0xe0661f, name:'旋鈕 EC11', explode:[0,-140, 0]},
  {file:'stl/pr_clamp.stl', color:0x3b4657, name:'被動輻射器壓框', explode:[0, 70, 0]}
];

const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({canvas, antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0d1218);
scene.fog = new THREE.Fog(0x0d1218, 420, 900);

const camera = new THREE.PerspectiveCamera(38, innerWidth/innerHeight, 1, 3000);
camera.position.set(215, 165, 250);

const controls = new THREE.OrbitControls(camera, canvas);
controls.target.set(0, 0, 56);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 120; controls.maxDistance = 800;

scene.add(new THREE.HemisphereLight(0xdfe9f5, 0x1a2430, 0.85));
const key = new THREE.DirectionalLight(0xffffff, 1.05);
key.position.set(180, 320, 220); key.castShadow = true;
key.shadow.mapSize.set(1024,1024);
key.shadow.camera.left=-260; key.shadow.camera.right=260;
key.shadow.camera.top=260; key.shadow.camera.bottom=-260;
scene.add(key);
const fill = new THREE.DirectionalLight(0x9fc4ff, 0.45); fill.position.set(-240,120,-160); scene.add(fill);

// 桌面（接收陰影）
const ground = new THREE.Mesh(new THREE.PlaneGeometry(1400,1400),
  new THREE.MeshStandardMaterial({color:0x141d27, roughness:1}));
ground.rotation.x = -Math.PI/2; ground.position.y = -8.2; ground.receiveShadow = true;
scene.add(ground);

const mat = (c)=> new THREE.MeshStandardMaterial({color:c, roughness:0.55, metalness:0.08,
  flatShading:false, side:THREE.DoubleSide});
const group = new THREE.Group(); scene.add(group);
const parts = [];

// 螢幕示意（貼在面板後面，讓窗不是空的）
const sc = document.createElement('canvas'); sc.width = 320; sc.height = 240;
const sx = sc.getContext('2d');
sx.fillStyle='#0b1220'; sx.fillRect(0,0,320,240);
sx.fillStyle='#16233a'; for(let i=0;i<12;i++) sx.fillRect(0, 200-i*14, 320, 2);
sx.fillStyle='#7ee787'; sx.font='bold 20px monospace'; sx.fillText('miniMac', 14, 34);
sx.fillStyle='#8fa3b8'; sx.font='12px monospace'; sx.fillText('BLUETOOTH A2DP', 14, 52);
sx.fillStyle='#ffb74d'; sx.font='bold 13px monospace'; sx.fillText('NOW PLAYING', 14, 186);
sx.fillStyle='#e8eef6'; sx.fillText('close my eyes…', 14, 206);
for(let i=0;i<16;i++){ const h=10+Math.abs(Math.sin(i*0.7))*46;
  sx.fillStyle = i%3? '#4ade80':'#ffb74d'; sx.fillRect(14+i*18, 168-h, 12, h); }
const tex = new THREE.CanvasTexture(sc);
const screen = new THREE.Mesh(new THREE.PlaneGeometry(62,47),
  new THREE.MeshBasicMaterial({map:tex}));
screen.position.set(0, -59.25, 67); screen.rotation.y = Math.PI;
group.add(screen);

const loader = new THREE.STLLoader();
let loaded = 0;
PARTS.forEach((p, i)=>{
  loader.load(p.file, geo=>{
    geo.computeVertexNormals();
    const m = new THREE.Mesh(geo, mat(p.color));
    m.castShadow = true; m.receiveShadow = true;
    m.userData = p; group.add(m); parts.push(m);
    if(++loaded === PARTS.length) finish();
  }, undefined, err=>{ document.getElementById('loading').textContent = '模型載入失敗：'+p.file; });
});

function finish(){
  document.getElementById('loading').style.display='none';
  window.__minimac = {parts: parts.length, status:'loaded'};
  fetch('cad/export/dims.json').then(r=>r.json()).then(fillDims).catch(()=>{});
}

function fillDims(d){
  document.getElementById('d-out').textContent = `${d.outer.W} × ${d.outer.D} × ${d.outer.H} mm`;
  document.getElementById('d-in').textContent = `${d.inner.W} × ${d.inner.D} × ${d.inner.H} mm`;
  document.getElementById('d-win').textContent = `${d.screen.window[0]} × ${d.screen.window[1]} mm（模組 ${d.screen.module[0]}×${d.screen.module[1]}）`;
  document.getElementById('d-drv').textContent = `Ø${d.driver.d} × 2，離桌 ${d.foot_h} mm`;
  document.getElementById('d-fc').textContent = `${d.forehead} / ${d.chin} mm`;
  const t = document.getElementById('tbl');
  t.innerHTML = '<tr><td>零件</td><td>放置位置</td><td>結果</td></tr>' + d.parts.map(p=>{
    const bad = p.issues.length>0;
    return `<tr><td>${p.name}</td><td>${p.note||''}</td><td class="${bad?'bad':'ok'}">${bad?p.issues.join('、'):'✓ 不干涉'}</td></tr>`;
  }).join('');
  const v = document.getElementById('verdict');
  v.className = d.conflicts.length ? 'bad' : 'ok';
  v.textContent = d.conflicts.length ? '✗ 有干涉：' + d.conflicts.join('；') : '✓ 全部零件尺寸檢查通過（干涉 0 件）';
  window.__minimac = {parts: parts.length, status:'dims', conflicts: d.conflicts.length, outer: d.outer};
  document.getElementById('check').dataset.ok = d.conflicts.length ? '0' : '1';
}

const ex = document.getElementById('explode');
ex.addEventListener('input', ()=>{
  const k = ex.value/100;
  parts.forEach(m=>{
    const e = m.userData.explode;
    m.position.set(e[0]*k, e[1]*k, e[2]*k);
  });
  screen.visible = k < 0.05;
});
document.getElementById('spin').addEventListener('click', e=>{
  controls.autoRotate = !controls.autoRotate;
  controls.autoRotateSpeed = 1.2;
  e.target.textContent = '自動旋轉：' + (controls.autoRotate?'開':'關');
});

const VIEWS = {
  front:[0, 0, 330], iso:[230,180,260], back:[0, 40, -350], bottom:[0,-330,120]
};
function setView(k){
  const v = VIEWS[k] || VIEWS.iso;
  camera.position.set(v[0], v[1], v[2]);
  controls.target.set(0,0, k==='bottom'?40:56);
}
window.setView = setView;

addEventListener('resize', ()=>{
  camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
(function loop(){ requestAnimationFrame(loop); controls.update(); renderer.render(scene,camera); })();
</script>
</body>
</html>
